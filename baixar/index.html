<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Baixar os arquivos do seu site | ClickGo</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#f6efe4">
<link rel="icon" href="../favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
<div class="malha" aria-hidden="true"></div>

<header class="topo">
  <div class="wrap topo-in">
    <a class="marca" href="../" aria-label="ClickGo, início">
      <img src="../assets/logo-clickgo.webp" width="38" height="38" alt="">
      <span>ClickGo</span>
    </a>
  </div>
</header>

<main class="legal">
  <div class="wrap estreito">
    <h1>Arquivos do seu site</h1>
    <p id="baixar-status" role="status">Preparando o seu arquivo…</p>
    <p><a id="baixar-link" class="bt bt-p" href="#" hidden>Baixar o .zip de novo</a></p>
    <p class="aviso-sub">O arquivo é aberto aqui mesmo, no seu aparelho: a chave dele fica só no seu link e não passa por nenhum servidor. Guarde uma cópia do .zip; o link vale por 7 dias.</p>
  </div>
</main>
<script src="/baixar.js?v=1"></script>
