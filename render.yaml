# Render: Static Site (sem build). Blueprint opcional; o painel do Render também funciona sem este arquivo.
# Cabeçalhos de segurança (auditoria 20/10/2026). ATENÇÃO: o Render só lê estes headers se o serviço estiver ligado a este
# Blueprint; se não estiver, cole os mesmos em Settings > Headers (path /*) no painel do Render.
# CSP (24/10: + frame-src *.facebook.com do SDK do Embedded Signup em /conectar; 23/10: + Cloudflare Turnstile em challenges.cloudflare.com, script e frame; 22/10: + Pixel da Meta em connect.facebook.net/www.facebook.com e Microsoft Clarity em *.clarity.ms): script só do próprio site (nenhum script inline); estilo inline liberado (as prévias do editor, em srcdoc, herdam
# esta política e têm <style>); API em orbixbr.onrender.com; prévia/site do cliente em previa./sites.clickgo.dev.br e
# *.github.io e clickgo-previas/clickgo-sites.pages.dev (Cloudflare Pages, migração 23/10; iframe, fetch do editor e <base> do editor). 23/10: saiu 127.0.0.1/localhost (connect, frame e base-uri): o
# teste local (?api=...) só vale com a página aberta em localhost, onde este cabeçalho do Render não existe.
services:
  - type: web
    name: solutiva-site
    runtime: static
    buildCommand: ""
    staticPublishPath: .
    # 26/10/2026: link antigo/errado da prévia vai para o formulário (o plantão mandou /prévia/; as pastas previa/ e prévia/
    # têm a mesma ida por meta refresh caso o serviço não esteja ligado a este Blueprint)
    routes:
      - type: redirect
        source: /previa/*
        destination: /esboco/
      - type: redirect
        source: /prévia/*
        destination: /esboco/
      - type: redirect
        source: /pr%C3%A9via/*
        destination: /esboco/
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=604800
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' https://challenges.cloudflare.com https://connect.facebook.net https://www.clarity.ms https://scripts.clarity.ms; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' data: https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https://www.facebook.com https://connect.facebook.net https://*.clarity.ms https://orbixbr.onrender.com https://previa.clickgo.dev.br https://sites.clickgo.dev.br https://*.github.io https://clickgo-previas.pages.dev https://clickgo-sites.pages.dev; frame-src 'self' https://challenges.cloudflare.com https://www.facebook.com https://web.facebook.com https://staticxx.facebook.com https://previa.clickgo.dev.br https://sites.clickgo.dev.br https://*.github.io https://clickgo-previas.pages.dev https://clickgo-sites.pages.dev; base-uri 'self' https://previa.clickgo.dev.br https://sites.clickgo.dev.br https://*.github.io https://clickgo-previas.pages.dev https://clickgo-sites.pages.dev; form-action 'self'; object-src 'none'; frame-ancestors 'none'"
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
